# Release on a v* tag push: the shared workflow cross-builds, publishes the
# GitHub Release, and regenerates + pushes the Homebrew formula. To release:
#   git tag vX.Y.Z && git push origin vX.Y.Z
name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    uses: shhac/homebrew-tap/.github/workflows/go-release.yml@main
    permissions:
      contents: write
    secrets: inherit
    with:
      name: agent-dlocal
      desc: "dLocal payments investigation and triage CLI for AI agents"
      formula_class: AgentDlocal
      # Asserted against `agent-dlocal --help` by the generated formula's test
      # block, so it must stay a literal substring of the root command's Short.
      help_match: "dLocal payments investigation and triage CLI"
